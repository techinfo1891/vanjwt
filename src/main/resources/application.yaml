spring:
  application:
    name: vanjwt

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driverClassName: org.h2.Driver

  h2:
    console:
      enabled: true
      
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  # ─── ADD THIS LINE FOR DATA INITIALIZATION ───
  sql:
    init:
      mode: always

# user roles (Moved outside the spring block if they are custom properties)
role:
  admin: ADMIN
  user: USER

server:
  port: 8086